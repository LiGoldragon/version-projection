[package]
name         = "version-projection"
version      = "0.1.0"
edition      = "2024"
rust-version = "1.85"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/version-projection"
description  = "Version projection primitives for component schema handover."
publish      = false

[lib]
name = "version_projection"
path = "src/lib.rs"

[features]
default = []
nota-text = ["dep:nota-next"]

[dependencies]
nota-next  = { git = "https://github.com/LiGoldragon/nota-next.git", branch = "main", optional = true }
rkyv       = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
thiserror  = "2"

[dev-dependencies]
nota-next  = { git = "https://github.com/LiGoldragon/nota-next.git", branch = "main" }

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = "warn"
